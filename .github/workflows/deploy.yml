name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  validate-kotlin:
    name: Validate Kotlin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build fat jar
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar --no-daemon

      - name: Smoke test day1 solver
        run: |
          OUTPUT=$(java -jar build/libs/aoc-solver.jar --year 2025 --day 1 --part 1 \
            < editions/2025/day1/input.txt)
          echo "$OUTPUT"
          # Uncomment and set the real expected answer once known, to catch
          # silent wrong-answer regressions rather than just crashes:
          # echo "$OUTPUT" | grep -q "EXPECTED_ANSWER" || (echo "Smoke test failed: unexpected output" && exit 1)

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoc-solver-jar
          path: build/libs/aoc-solver.jar
          retention-days: 1

  validate-docker:
    name: Validate Docker build
    needs: validate-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aoc-webserver .

      - name: Smoke test container
        run: |
          docker run -d -p 10000:10000 --name aoc-test \
            -e PORT=10000 \
            aoc-webserver

          for i in $(seq 1 15); do
            if curl -sf http://localhost:10000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          RESPONSE=$(curl -sf -X POST http://localhost:10000/solve \
            -H "Content-Type: application/json" \
            -d '{"year":"2025","day":"1","part":"1","input_file":"R38\nR2\nL2"}')

          echo "$RESPONSE"

          docker logs aoc-test
          docker stop aoc-test

  deploy:
    name: Trigger Render deploy
    needs: [validate-kotlin, validate-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"